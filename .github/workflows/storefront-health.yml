name: Storefront Health
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-health
  cancel-in-progress: true
jobs:
  public-product-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check published Gumroad listings
        run: node scripts/check-storefronts.mjs
